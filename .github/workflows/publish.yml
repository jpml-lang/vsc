name: Publish

# Packages the extension and publishes it to the Visual Studio Marketplace and
# Open VSX. Neither registry supports GitHub's OIDC trust the way PyPI and npm
# do, so each publish job reads an access token from its own GitHub
# environment. See "Releasing" in README.md for the one-time setup.
#
# Runs on a published GitHub Release, or manually to retry a failed upload.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Unit tests and grammar snapshots
        run: bun run test

      - name: Verify the release tag matches the extension version
        if: github.event_name == 'release'
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json: $version / tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::package.json version ($version) does not match the release tag ($tag)"
            exit 1
          fi

      # 'vsce package' runs the vscode:prepublish script, which bundles dist/.
      - name: Package the extension
        run: bun run package

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  marketplace:
    name: Publish to the VS Code Marketplace
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=jpml-lang.jpml
    permissions:
      actions: read     # lets download-artifact fetch the build output

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3 publish --packagePath *.vsix

  open-vsx:
    name: Publish to Open VSX
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: open-vsx
      url: https://open-vsx.org/extension/jpml-lang/jpml
    permissions:
      actions: read

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1 publish *.vsix
